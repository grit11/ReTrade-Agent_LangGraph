services:
  retrade:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ${RETRADE_EXTRAS:-}
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/runtime
      REDIS_URL: redis://redis:6379/0
    volumes:
      - retrade-runtime:/app/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  retrade-runtime:
  redis-data:
