[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrade-agent-langgraph"
version = "0.1.0"
description = "Standalone stateful customer service with LangChain and LangGraph"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain==1.2.18", "langgraph==1.1.10",
  "langchain-openai==1.2.1", "langgraph-checkpoint-sqlite==3.1.1",
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1", "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1", "jieba==0.42.1",
  "pypdf>=5,<7", "python-docx>=1.1,<2",
  "redis>=5.2,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
milvus = ["pymilvus>=2.5,<3"]
postgres = ["langgraph-checkpoint-postgres==3.1.2", "psycopg[binary,pool]>=3.2,<4"]
ui-test = ["playwright>=1.50,<2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["graph: real LangGraph runtime tests", "live: explicitly enabled paid/external calls"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
